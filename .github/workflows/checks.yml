name: PlanBranch checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python scripts/build_release.py
      - run: python -m pip install --no-deps --no-index --target output/wheel-ci dist/flowdesk-0.2.0-py3-none-any.whl
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          FLOWDESK_PYTHON: python
          FLOWDESK_APP_ROOT: ${{ github.workspace }}/output/wheel-ci
      - name: Build Windows portable package
        if: runner.os == 'Windows'
        run: python scripts/build_windows_portable.py
      - name: Verify standalone Windows portable package
        if: runner.os == 'Windows'
        run: python scripts/smoke_windows_portable.py dist/PlanBranch-0.2.0-windows-x64.zip --output-dir output/portable-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: PlanBranch-windows-x64
          path: |
            dist/PlanBranch-*-windows-x64.zip
            dist/PlanBranch-*-windows-x64.zip.json
            output/portable-smoke/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.os }}
          path: |
            output/playwright/
            output/portable-smoke/
